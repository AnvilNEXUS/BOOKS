P||Numbers are also a way of opening up such a world of endless possibilities, just in a rather less visually vivid way. (We’ll come back to the use of pictures in maths in Chapter 7.) And aside from being less pictorially enticing, numbers can seem rather closed off if the only thing you then do with them is answer specific questions with specific answers, and then you get told you’re either right or wrong.||Các con số cũng là một cách mở ra một thế giới với những khả năng vô tận như vậy, chỉ là theo một cách ít sống động về mặt thị giác hơn. (Chúng ta sẽ quay lại với việc sử dụng hình ảnh trong toán học ở Chương 7.) Và bên cạnh việc ít lôi cuốn về mặt hình ảnh hơn, các con số có thể dường như khá khép kín nếu điều duy nhất bạn làm với chúng sau đó chỉ là trả lời các câu hỏi cụ thể với những đáp án cụ thể, rồi sau đó bị phán xét là bạn đúng hay sai.
P||Numbers are definitely not the be-all-and-end-all of mathematics, but they are a beginning of how we learn to reason with abstraction. The important steps of this process are something like the following.||Các con số chắc chắn không phải là điểm khởi đầu và kết thúc tối hậu của toán học, nhưng chúng là khởi đầu cho cách chúng ta học suy luận bằng sự trừu tượng hóa. Các bước quan trọng của quá trình này diễn ra đại khái như sau.
P||First we decide what aspects of a situation we’re interested in. Perhaps we spot similarities between various different situations and feel curious about why those similarities are arising. Then we perform the abstraction: we focus on the parts of the situation that are similar, and if we’re focusing on quantity, we come up with something like numbers, which is the 'essence' of what we are focusing on right now. This constitutes the creation of a new abstract world which we can then explore, to work out how things work there, what sorts of creatures live there, what sort of weird and wonderful landscapes lurk around the corner.||Đầu tiên, chúng ta quyết định xem mình quan tâm đến những khía cạnh nào của một tình huống. Có lẽ chúng ta phát hiện ra những điểm tương đồng giữa nhiều tình huống khác nhau và cảm thấy tò mò về lý do tại sao những điểm tương đồng đó lại xuất hiện. Sau đó, chúng ta thực hiện việc trừu tượng hóa: chúng ta tập trung vào các phần của tình huống có tính tương đồng, và nếu chúng ta đang tập trung vào số lượng, chúng ta sẽ nghĩ ra một thứ gì đó giống như các con số – thứ vốn là "bản chất" của những gì chúng ta đang tập trung vào ngay lúc này. Điều này tạo nên sự ra đời của một thế giới trừu tượng mới mà sau đó chúng ta có thể khám phá, để tìm hiểu xem mọi thứ vận hành ở đó như thế nào, những sinh vật nào sống ở đó, những cảnh quan kỳ lạ và kỳ diệu nào đang ẩn nấp quanh góc phố.
P||If we ever feel constrained by that world, we can just make a new one and explore that, and we often do. On the other hand, if we feel like we want to know more about how this relates back to the world around us, we can also do that. If we want to make a different relation between the world around us and our abstract one, we can do that too; for example, we can measure quantity in different ways, count things differently, or associate numbers to things in many different ways, like when we rate a restaurant according to various different criteria. If we want to focus on a different aspect of the world around us, such as shape instead of quantity, we can do that.||Nếu chúng ta từng cảm thấy bị gò bó bởi thế giới đó, chúng ta chỉ cần tạo ra một thế giới mới và khám phá nó, và chúng ta thường xuyên làm như vậy. Mặt khác, nếu chúng ta cảm thấy muốn biết nhiều hơn về việc điều này liên hệ ngược trở lại với thế giới xung quanh chúng ta ra sao, chúng ta cũng có thể làm điều đó. Nếu chúng ta muốn tạo ra một mối liên hệ khác giữa thế giới xung quanh và thế giới trừu tượng của mình, chúng ta cũng có thể thực hiện; ví dụ, chúng ta có thể đo lường số lượng theo những cách khác nhau, đếm mọi thứ theo cách khác, hoặc gán các con số cho các sự vật theo nhiều cách khác nhau, chẳng hạn như khi chúng ta đánh giá một nhà hàng theo nhiều tiêu chí khác nhau. Nếu chúng ta muốn tập trung vào một khía cạnh khác của thế giới xung quanh, chẳng hạn như hình dạng thay vì số lượng, chúng ta hoàn toàn có thể làm điều đó.
P||It’s a bit like being given a new box of paints, and deciding to mix them up a bit to see what you can do with them. But the wonderful thing about mathematical paint is that you never run out of it. There’s no risk that you’ll 'waste' it by mixing it in ways you don’t like, because they’re just ideas, so there’s always more around to experiment with. Playing around with numbers doesn’t use them up, and this is the same with all abstract concepts. It is one of the most fun and satisfying aspects of maths, to me. But it does also raise the perplexing question of whether any of this is real.||Nó hơi giống như việc được tặng một hộp sơn mới và quyết định pha trộn chúng một chút để xem bạn có thể làm được gì với chúng. Nhưng điều tuyệt vời về "sơn toán học" là bạn không bao giờ dùng hết nó. Không có nguy cơ bạn sẽ "lãng phí" nó bằng cách pha trộn theo những cách bạn không thích, bởi vì chúng chỉ là những ý tưởng, nên luôn có nhiều hơn để thử nghiệm. Việc nghịch ngợm với các con số không làm cạn kiệt chúng, và điều này cũng tương tự với mọi khái niệm trừu tượng. Đối với tôi, đó là một trong những khía cạnh thú vị và thỏa mãn nhất của toán học. Nhưng nó cũng đặt ra một câu hỏi đầy bối rối: liệu có bất kỳ điều gì trong số này là có thực hay không?
H2||ARE ABSTRACT CONCEPTS REAL?||CÁC KHÁI NIỆM TRỪU TƯỢNG CÓ THỰC HAY KHÔNG?
P||The first thing I think about this question is: what does 'real' even mean? Is anything real? If I think about it too hard I can quite easily convince myself that I’m not real and that nothing is real.||Điều đầu tiên tôi nghĩ về câu hỏi này là: "thực" thậm chí có nghĩa là gì? Có thứ gì là thực không? Nếu tôi suy nghĩ quá nhiều về điều đó, tôi có thể dễ dàng thuyết phục bản thân rằng mình không có thực và chẳng có gì là có thực cả.
P||If you’ve ever wondered if maths is real, you might have been told it’s a stupid question. Perhaps you looked around you and saw that people who were 'good at maths' didn’t worry about this sort of question, they just got on with getting the right answers.||Nếu bạn từng tự hỏi liệu toán học có thực hay không, có thể bạn đã bị bảo rằng đó là một câu hỏi ngớ ngẩn. Có lẽ bạn nhìn xung quanh và thấy rằng những người "giỏi toán" chẳng bận tâm về loại câu hỏi này, họ chỉ lo làm sao để đưa ra câu trả lời đúng.
P||Well, I’d like to reassure you that mathematicians and especially philosophers do wonder about the status of maths. Do numbers exist? I am not a philosopher so I am not going to go into the philosophy of that, I am just going to say what I think.||Chà, tôi muốn trấn an bạn rằng các nhà toán học và đặc biệt là các triết gia thực sự có băn khoăn về vị thế thực tại của toán học. Các con số có tồn tại không? Tôi không phải là một triết gia nên tôi sẽ không đi sâu vào khía cạnh triết học của vấn đề đó, tôi chỉ nói những gì mình nghĩ.
P||In order to examine what it means for something to be 'real' it might help us to think of some things that we think of as real and not real. There are many concrete things we can touch that we probably all agree are real. The world is real, people are real, food is real. Then there are things we can’t touch that we might think are real, such as hunger, love, poverty. Then there are perhaps things we can agree are not real, such as the Easter Bunny, the Tooth Fairy and Santa. And there are some things that people really don’t agree on, like God, UFOs, ghosts and unfortunately COVID.||Để xem xét ý nghĩa của việc một thứ gì đó là "có thực", có thể sẽ hữu ích nếu chúng ta nghĩ về một số thứ mà chúng ta coi là có thực và không có thực. Có nhiều thứ cụ thể mà chúng ta có thể chạm vào mà có lẽ tất cả chúng ta đều đồng ý là có thực. Thế giới là có thực, con người là có thực, thức ăn là có thực. Sau đó có những thứ chúng ta không thể chạm vào nhưng chúng ta có thể nghĩ là có thực, chẳng hạn như cơn đói, tình yêu, sự nghèo khó. Rồi có lẽ có những thứ chúng ta có thể đồng ý là không có thực, chẳng hạn như Thỏ Phục Sinh, Nàng Tiên Răng và Ông già Noel. Và có một số thứ mà mọi người thực sự không đồng thuận, như Chúa, UFO, ma quỷ và thật không may, cả COVID.
P||Hold on a second though, because actually I believe that Santa and the Tooth Fairy are real. At this point you might think I’ve lost my mind, but let me try and explain.||Tuy nhiên, hãy khoan một chút, bởi vì thực ra tôi tin rằng Ông già Noel và Nàng Tiên Răng là có thực. Đến đây bạn có thể nghĩ rằng tôi đã mất trí, nhưng hãy để tôi cố gắng giải thích.
P||Small children in certain cultures think (or are told by adults) that Santa or Father Christmas is a man with a fluffy white beard who wears a red outfit and flies around the world delivering presents to children, in a sleigh drawn by reindeer. At some point these children grow up and are disillusioned to discover that actually their presents (if they celebrate Christmas) come from their parents, and are simply placed under the tree while they are asleep. This is thought of as children realising that Santa 'isn’t real'.||Trẻ nhỏ ở một số nền văn hóa nghĩ (hoặc được người lớn bảo) rằng Ông già Noel là một người đàn ông có bộ râu trắng bồng bềnh, mặc bộ đồ màu đỏ và bay vòng quanh thế giới để phát quà cho trẻ em trên chiếc xe trượt tuyết do tuần lộc kéo. Đến một thời điểm nào đó, những đứa trẻ này lớn lên và vỡ mộng khi phát hiện ra rằng thực ra quà của chúng (nếu chúng đón Giáng sinh) là do cha mẹ tặng, và chỉ đơn giản là được đặt dưới gốc cây trong khi chúng đang ngủ. Điều này được coi là việc trẻ con nhận ra rằng Ông già Noel "không có thực".
P||However, I argue that this doesn’t mean Santa isn’t real, it just means that the rather unrealistic traditional description of Santa isn’t literally accurate. However, something exists: there is something that results in presents being delivered to children all round the world on Christmas morning. That thing is an abstract concept – it’s an idea of Santa. You might think that the idea of Santa exists, but Santa still doesn’t. However, mathematical concepts are so abstract that they are nothing but ideas. The idea of the number two is the number two. And those ideas are real. I’m very used to treating abstract mathematical ideas as real objects, so I’m happy to think of Santa as a real abstract concept too. Taking ideas seriously and treating them as real things is an important part of how maths develops.||Tuy nhiên, tôi lập luận rằng điều này không có nghĩa là Ông già Noel không có thực, nó chỉ có nghĩa là mô tả truyền thống có phần phi thực tế về Ông già Noel không chính xác theo nghĩa đen. Tuy nhiên, có một cái gì đó tồn tại: có một điều gì đó dẫn đến kết quả là những món quà được chuyển đến cho trẻ em trên khắp thế giới vào sáng ngày Giáng sinh. Thứ đó là một khái niệm trừu tượng – đó là ý niệm về Ông già Noel. Bạn có thể nghĩ rằng ý niệm về Ông già Noel tồn tại, nhưng bản thân Ông già Noel thì vẫn không. Tuy nhiên, các khái niệm toán học trừu tượng đến mức chúng không là gì khác ngoài những ý tưởng. Ý niệm về số hai chính là số hai. Và những ý niệm đó là có thực. Tôi rất quen với việc coi các ý tưởng toán học trừu tượng là những thực thể có thật, vì vậy tôi cũng rất vui vẻ coi Ông già Noel là một khái niệm trừu tượng có thực. Việc coi trọng các ý tưởng và đối xử với chúng như những thứ có thật là một phần quan trọng trong cách toán học phát triển.
H2||HOW MATHS DEVELOPS||TOÁN HỌC PHÁT TRIỂN NHƯ THẾ NÀO
P||Maths might seem that it’s all about numbers and equations, but even if you think back to early school maths you might remember that other things were involved, perhaps shapes and patterns, and pictorial representations like bar charts and Venn diagrams. The research I do (in the very abstract branch of maths called category theory) doesn’t involve numbers and equations at all. So if maths isn’t just the study of numbers and equations, what is it? I often like to characterise maths as 'the study of how things work', except it’s not the study of any old things, and it’s not any old study either. I say:||Toán học có vẻ như chỉ xoay quanh các con số và phương trình, nhưng ngay cả khi bạn nhớ lại môn toán ở trường tiểu học, bạn có thể nhớ rằng còn có những thứ khác liên quan, có lẽ là các hình dạng và quy luật, cùng những biểu diễn bằng hình ảnh như biểu đồ cột và sơ đồ Venn. Nghiên cứu mà tôi làm (trong một nhánh toán học rất trừu tượng gọi là lý thuyết phạm trù) hoàn toàn không liên quan đến các con số và phương trình. Vậy nếu toán học không chỉ là việc nghiên cứu các con số và phương trình, thì nó là gì? Tôi thường thích mô tả toán học là "nghiên cứu về cách vạn vật vận hành", ngoại trừ việc nó không phải là nghiên cứu về bất kỳ thứ vu vơ nào, và nó cũng không phải là một kiểu nghiên cứu tùy tiện. Tôi cho rằng:
BQ||Mathematics is the logical study of<br><br>how logical things work.||Toán học là sự nghiên cứu hợp logic về<br><br>cách những thứ hợp logic vận hành.
P||The first issue here is that nothing really is logical: everything in life works by a mixture of logic and other things, such as randomness, chaos, emotions. Or possibly another point of view is that those things are also logical, just too complex for us to understand using logic. For example, the weather is actually logical, it’s just that we will never be able to take accurate enough measurements of what’s going on in the atmosphere to be able to use logic to predict the weather with any great certainty. The weather isn’t illogical, it’s just hard.||Vấn đề đầu tiên ở đây là chẳng có thứ gì thực sự hoàn toàn hợp logic: mọi thứ trong cuộc sống đều vận hành bởi sự pha trộn giữa tính logic và những thứ khác, chẳng hạn như sự ngẫu nhiên, sự hỗn loạn, cảm xúc. Hoặc có thể có một góc nhìn khác là những thứ đó cũng hợp logic, chỉ là quá phức tạp để chúng ta có thể hiểu được bằng cách sử dụng logic. Ví dụ, thời tiết thực sự là hợp logic, chỉ là chúng ta sẽ không bao giờ có thể thực hiện các phép đo đủ chính xác về những gì đang diễn ra trong khí quyển để có thể sử dụng logic nhằm dự đoán thời tiết với độ chắc chắn cao. Thời tiết không phải là phi logic, nó chỉ đơn giản là quá khó.
P||Mostly maths deals with this by the process I was just describing: abstraction. We forget certain details about situations with the aim of moving us away from the messy 'real' world into the abstract world of ideas, where things do behave according to logic, because we’ve conveniently ignored (temporarily) the parts that don’t. I don’t want to call the non-abstract world 'real' though, because I don’t think abstract ideas are unreal, so I prefer to call the non-abstract world 'concrete': the world we can touch.||Hầu hết toán học đối phó với điều này bằng quá trình mà tôi vừa mô tả: sự trừu tượng hóa. Chúng ta bỏ qua một số chi tiết nhất định về các tình huống với mục đích đưa chúng ta rời xa thế giới "thực" lộn xộn để bước vào thế giới trừu tượng của các ý niệm, nơi mọi thứ vận hành theo logic, bởi vì chúng ta đã thuận tiện phớt lờ (một cách tạm thời) những phần không tuân theo logic. Tuy nhiên, tôi không muốn gọi thế giới phi trừu tượng là "thực", bởi vì tôi không nghĩ các ý tưởng trừu tượng là không có thực, vì vậy tôi thích gọi thế giới phi trừu tượng là "thế giới cụ thể": thế giới mà chúng ta có thể chạm vào được.
P||One fascinating aspect of maths is that it isn’t just defined by what it studies. Most subjects, like history, biology, psychology, economics, are defined by what they study, and then techniques are developed to study those things. But maths has a cyclical situation going on, where what we can study is defined by how we study it, so that we can find new things to study as well as us then finding new ways to study those things. It’s something like this:||Một khía cạnh hấp dẫn của toán học là nó không chỉ được định nghĩa bởi những gì nó nghiên cứu. Hầu hết các bộ môn, như lịch sử, sinh học, tâm lý học, kinh tế học, đều được định nghĩa bởi đối tượng mà chúng nghiên cứu, và sau đó các kỹ thuật được phát triển để nghiên cứu những đối tượng đó. Nhưng toán học có một chu trình tuần hoàn diễn ra, trong đó những gì chúng ta có thể nghiên cứu lại được định nghĩa bởi cách chúng ta nghiên cứu nó, để chúng ta có thể tìm ra những thứ mới để nghiên cứu cũng như tìm ra những cách thức mới để nghiên cứu những thứ đó. Nó diễn ra đại khái như thế này:
IMG||ismathreal-0195.jpg
P||But really each arrow is giving us new things, so we’re not going round the same circle over and over again – it’s more like a spiral, where we are going round and round but also going up and up at the same time. We keep finding things to study using our new methods, and finding new methods for studying those things, and the situation keeps escalating, a bit like climbing up this spiral 'staircase' starting at the bottom with numbers:||Nhưng thực ra mỗi mũi tên lại mang đến cho chúng ta những điều mới mẻ, vì vậy chúng ta không đi quanh cùng một vòng tròn lặp đi lặp lại – nó giống như một đường xoắn ốc hơn, nơi chúng ta vừa xoay vòng vừa đồng thời tiến lên cao dần. Chúng ta liên tục tìm thấy những điều mới để nghiên cứu bằng cách sử dụng các phương pháp mới của mình, và tìm ra các phương pháp mới để nghiên cứu những điều đó, và tình hình cứ thế tiếp tục leo thang, hơi giống như việc leo lên chiếc "cầu thang" xoắn ốc này, bắt đầu từ dưới đáy với các con số:
IMG||ismathreal-00007.jpg
P||So we have a sort of spiral staircase going up forever. I’d like to demonstrate how this might work, by going on a little wander up the staircase to see where it can take us. This isn’t directly addressing the question about one plus one, but it’s doing some background exploration so that we can eventually address the question in a meaningful way.||Vì vậy, chúng ta có một loại cầu thang xoắn ốc đi lên mãi mãi. Tôi muốn chứng minh điều này có thể hoạt động như thế nào, bằng cách cùng dạo bước một đoạn ngắn lên chiếc cầu thang để xem nó có thể dẫn chúng ta đến đâu. Điều này không trực tiếp giải quyết câu hỏi về một cộng một, nhưng nó thực hiện một số bước khám phá nền tảng để cuối cùng chúng ta có thể giải quyết câu hỏi đó một cách có ý nghĩa.
P||The 'staircase' all started by us working out how to perform abstraction on things around us to get to numbers. Numbers behave more logically than cookies, cows or whatever it is we were trying to count. We then come up with some ways to study numbers, such as investigating how they are related to each other by adding and subtracting, multiplying and dividing.||Chiếc "cầu thang" đều bắt đầu từ việc chúng ta tìm ra cách thực hiện sự trừu tượng hóa trên những thứ xung quanh mình để đi đến các con số. Các con số hành xử hợp logic hơn bánh quy, đàn bò hay bất cứ thứ gì chúng ta đang cố gắng đếm. Sau đó, chúng ta nghĩ ra một số cách để nghiên cứu các con số, chẳng hạn như điều tra xem chúng liên quan với nhau như thế nào bằng cách cộng và trừ, nhân và chia.
P||We then realise that there might be more things we can study in a similar way, shapes perhaps. We realise that we can perform abstraction on things around us to find similarities between, say, a window, a door and a tabletop, because they’re all rectangles. And we find we can roll up a semicircle to make a cone for a hat, which is also a good shape for a traffic cone, or (if we turn it the other way up) a handy edible container for ice cream. Incidentally, here’s what I mean by this being an emotional account of maths rather than a history of maths – of course, cones were studied long before traffic cones and ice cream cones.||Sau đó, chúng ta nhận ra rằng có thể có nhiều thứ hơn mà chúng ta có thể nghiên cứu theo cách tương tự, chẳng hạn như các hình khối. Chúng ta nhận ra rằng mình có thể thực hiện sự trừu tượng hóa trên những thứ xung quanh để tìm ra điểm tương đồng giữa, chẳng hạn, một cửa sổ, một cánh cửa và một mặt bàn, bởi vì tất cả chúng đều là hình chữ nhật. Và chúng ta thấy mình có thể cuộn một hình bán nguyệt lại để tạo thành một hình nón làm chiếc mũ, đó cũng là một hình dạng tốt cho một cọc tiêu giao thông, hoặc (nếu chúng ta lật ngược nó lại) một chiếc ốc quế tiện dụng ăn được để đựng kem. Nhân tiện, đây là ý tôi khi nói đây là một lời kể mang tính cảm xúc về toán học chứ không phải là một lịch sử toán học – dĩ nhiên, hình nón đã được nghiên cứu từ rất lâu trước khi có cọc tiêu giao thông và kem ốc quế.
P||So how do we study shapes using the techniques we developed for studying numbers? Well, we might think about adding and subtracting shapes, that is, sticking them together and cutting parts out. We can also think about multiplying shapes, but this is a little harder, and it pushes us to think more deeply about what multiplication means, as we’ll now see.||Vậy làm thế nào để chúng ta nghiên cứu các hình dạng bằng cách sử dụng các kỹ thuật mà chúng ta đã phát triển để nghiên cứu các con số? Chà, chúng ta có thể nghĩ về việc cộng và trừ các hình dạng, nghĩa là dán chúng lại với nhau và cắt bớt các phần đi. Chúng ta cũng có thể nghĩ về việc nhân các hình dạng, nhưng điều này khó hơn một chút, và nó thôi thúc chúng ta suy nghĩ sâu sắc hơn về ý nghĩa thực sự của phép nhân, như chúng ta sẽ thấy bây giờ.
H2||EXPANDING THE CONCEPT OF MULTIPLICATION||MỞ RỘNG KHÁI NIỆM PHÉP NHÂN
P||Multiplication of numbers might be something we’re comfortable with or horrified by, but either way it’s something we are likely to take for granted. However, if instead of taking something for granted we think hard about what it really means or how it really works, it sometimes enables us to get much more out of it. This isn’t always the case – sometimes it just means we get mentally paralysed, like if we think too hard about what life means. But if I think really hard about, say, my comfort zone, then I can get much more out of it and can expand what I’m comfortable doing, rather than having to feel like I’m stepping outside my comfort zone.||Phép nhân các con số có thể là thứ mà chúng ta cảm thấy thoải mái hoặc kinh hãi, nhưng dù thế nào đi nữa, đó là thứ mà chúng ta thường coi là điều hiển nhiên. Tuy nhiên, nếu thay vì coi một điều gì đó là hiển nhiên mà chúng ta lại suy nghĩ thấu đáo về ý nghĩa thực sự của nó hoặc cách nó thực sự vận hành, đôi khi nó cho phép chúng ta thu được nhiều điều hơn từ nó. Điều này không phải lúc nào cũng đúng – đôi khi nó chỉ khiến chúng ta bị tê liệt về mặt tinh thần, chẳng hạn như nếu chúng ta suy nghĩ quá nhiều về ý nghĩa của cuộc sống. Nhưng nếu tôi suy nghĩ thực sự thấu đáo về, chẳng hạn, vùng an toàn của mình, thì tôi có thể thu được nhiều điều hơn từ nó và có thể mở rộng những gì tôi cảm thấy thoải mái khi làm, thay vì phải cảm thấy như mình đang bước ra ngoài vùng an toàn.
P||We’re going to think hard about multiplication of numbers, and this is going to lead us to a way of multiplying other things, such as shapes, thereby expanding the concept of multiplication. Mathematicians have pushed this further and further and have gradually come up with a whole theory of when it is possible to multiply anything at all. Abstract mathematicians do this for all sorts of mathematical concepts, and probably aim to do it for all mathematical concepts, not just arithmetic.||Chúng ta sẽ suy nghĩ thấu đáo về phép nhân các con số, và điều này sẽ dẫn chúng ta đến một cách nhân những thứ khác, chẳng hạn như các hình khối, từ đó mở rộng khái niệm phép nhân. Các nhà toán học đã đẩy điều này đi xa hơn nữa và dần dần đưa ra cả một lý thuyết về thời điểm có thể nhân bất kỳ thứ gì. Các nhà toán học trừu tượng làm điều này cho đủ loại khái niệm toán học, và có lẽ hướng tới mục tiêu thực hiện nó cho tất cả các khái niệm toán học, chứ không riêng gì số học.
P||When we start out multiplying numbers, we might think of 4 × 2 as 'four lots of two', that is, 2 + 2 + 2 + 2. We can take two counters, and then two more, and two more, and two more, and then just count them up to see how many there are in all.||Khi mới bắt đầu nhân các con số, chúng ta có thể nghĩ 4 × 2 là "bốn nhóm hai", nghĩa là 2 + 2 + 2 + 2. Chúng ta có thể lấy hai đồng xu đếm, rồi thêm hai đồng nữa, hai đồng nữa, và hai đồng nữa, rồi chỉ việc đếm xem có tất cả bao nhiêu đồng.
IMG||ismathreal-00081.jpg
P||This might make sense for multiplying numbers by shapes, because '4 × a circle' could just be four circles, but it doesn’t make sense for multiplying shapes by shapes. If we were going to multiply a square by a circle what on earth would 'circle lots of square' mean? Well, we can interpret it to mean something if we’re a little more expansive or imaginative about our multiplication. One way is to rethink 4 × 2, this time starting with a column of 2 counters, and 'replicating' them along a line of 4 counters, making a 4-by-2 grid like this:||Điều này có thể có ý nghĩa đối với việc nhân các con số với các hình khối, bởi vì "4 × một hình tròn" có thể chỉ là bốn hình tròn, nhưng nó không có ý nghĩa đối với việc nhân các hình khối với các hình khối. Nếu chúng ta nhân một hình vuông với một hình tròn thì trên đời này "hình tròn nhóm hình vuông" có nghĩa là gì cơ chứ? Chà, chúng ta có thể diễn giải nó để nó mang một ý nghĩa nào đó nếu chúng ta cởi mở hơn hoặc giàu trí tưởng tượng hơn một chút về phép nhân của mình. Một cách là suy nghĩ lại về 4 × 2, lần này bắt đầu bằng một cột gồm 2 đồng xu đếm, và "sao chép" chúng dọc theo một hàng gồm 4 đồng xu, tạo thành một lưới 4 nhân 2 như thế này:
IMG||ismathreal-00161.jpg
P||With some imagination we could now picture doing this to a circle and square – we wave a square around along a circular path, and keep replicating the square as we go. It’s a bit hard to draw this on a page, but perhaps we could pick some different shapes, say a line and a circle. If we start with a vertical circle and 'replicate' it through the air in a straight line, we make this shape: a cylinder.||Với một chút tưởng tượng, bây giờ chúng ta có thể hình dung việc làm điều này với một hình tròn và một hình vuông – chúng ta vung một hình vuông di chuyển dọc theo một quỹ đạo hình tròn, và liên tục sao chép hình vuông đó khi nó di chuyển. Hơi khó để vẽ điều này trên một trang giấy, nhưng có lẽ chúng ta có thể chọn một số hình dạng khác, chẳng hạn như một đoạn thẳng và một hình tròn. Nếu chúng ta bắt đầu với một hình tròn thẳng đứng và "sao chép" nó trong không gian theo một đường thẳng, chúng ta tạo ra hình dạng này: một hình trụ.
IMG||ismathreal-00231.jpg
P||If we do it the other way round we’re waving a straight line through the air in the shape of a circle, and we also make a cylinder. (In both cases we need to make sure we’re waving in a direction that’s sort of at right angles to our shape.) This is like two different schemes for knitting the sleeve of a jumper: we could use circular needles and build up circles on circles until we have a cylindrical sleeve, or we could use normal needles, knit a rectangle, and then join the seam up to make a sleeve. (I know, it would need to be wider at one end than the other to make a shapely sleeve, but I hope you get the picture.)||Nếu chúng ta làm ngược lại, chúng ta vung một đoạn thẳng trong không gian theo hình dạng của một đường tròn, chúng ta cũng tạo ra một hình trụ. (Trong cả hai trường hợp, chúng ta cần đảm bảo rằng mình đang vung theo một hướng vuông góc với hình dạng ban đầu.) Điều này giống như hai cách đan khác nhau cho ống tay của một chiếc áo len: chúng ta có thể dùng kim đan vòng và đan các vòng tròn chồng lên các vòng tròn cho đến khi có một ống tay hình trụ, hoặc chúng ta có thể dùng kim đan thông thường, đan một mảnh hình chữ nhật, rồi khâu đường nối lại để tạo thành một ống tay áo. (Tôi biết, nó sẽ cần phải rộng hơn ở một đầu so với đầu kia để tạo thành một ống tay áo vừa vặn, nhưng tôi hy vọng bạn hình dung được bức tranh toàn cảnh.)
P||This is very vague but gives the general idea of how we think of 'multiplying shapes' together. What I’ve just said is that||Điều này rất khái quát nhưng mang lại ý niệm chung về cách chúng ta nghĩ về việc "nhân các hình dạng" với nhau. Những gì tôi vừa nói là
BQ||circle × line = cylinder||hình tròn × đoạn thẳng = hình trụ
P||and also||và cũng có
BQ||line × circle = cylinder||đoạn thẳng × hình tròn = hình trụ
P||so we have something like this||vì vậy chúng ta có một điều gì đó như thế này
BQ||circle × line = line × circle||hình tròn × đoạn thẳng = đoạn thẳng × hình tròn
P||which is analogous to the more familiar||điều này tương tự với biểu thức quen thuộc hơn
BQ||4 × 2 = 2 × 4||4 × 2 = 2 × 4
P||otherwise known as the 'commutativity of multiplication'. It’s an example of how we can start studying shapes a bit like how we study numbers. We’ll come back to more ways that happens later, including the idea of trying to understand what the fundamental building blocks are in each world.||hay còn gọi là "tính giao hoán của phép nhân". Đó là một ví dụ về cách chúng ta có thể bắt đầu nghiên cứu các hình dạng gần giống như cách chúng ta nghiên cứu các con số. Chúng ta sẽ quay lại với nhiều cách hơn mà điều đó diễn ra sau này, bao gồm cả ý tưởng cố gắng tìm hiểu xem các khối xây dựng nền tảng trong mỗi thế giới là gì.
P||Now that we’ve had the idea of including shapes in our logical studies, we can think of more ways of studying shapes, taking us another level up our 'spiral staircase'.||Bây giờ chúng ta đã có ý tưởng đưa các hình dạng vào các nghiên cứu hợp logic của mình, chúng ta có thể nghĩ ra nhiều cách hơn để nghiên cứu các hình dạng, đưa chúng ta lên một nấc thang khác trên "cầu thang xoắn ốc" của mình.
H2||CONTINUING UP THE SPIRAL STAIRCASE||TIẾP TỤC BƯỚC LÊN CẦU THANG XOẮN ỐC
P||We’ve looked at a way of studying shapes inspired by multiplication of numbers, but another way that isn’t so relevant to numbers is symmetry. Shapes are more subtle than numbers, and symmetry is an aspect of that subtlety.||Chúng ta đã xem xét một cách nghiên cứu các hình khối được lấy cảm hứng từ phép nhân các con số, nhưng một cách khác không liên quan nhiều đến các con số là tính đối xứng. Các hình dạng tinh tế hơn các con số, và tính đối xứng là một khía cạnh của sự tinh tế đó.
P||For example, a square and a rectangle are similar in some ways and different in others, and one way we can pin down the difference is to think about symmetry.||Ví dụ, một hình vuông và một hình chữ nhật tương đồng ở một số phương diện và khác nhau ở những phương diện khác, và một cách chúng ta có thể chỉ ra sự khác biệt là nghĩ về tính đối xứng.
IMG||ismathreal-00111.jpg
P||A square has more symmetry than a rectangle, because we can fold a square along a diagonal and the two sides meet up, but this doesn’t work for a general rectangle.[^1] In fact, this gives a handy way of making a square out of a rectangular piece of paper without having to use a ruler: fold a corner down as in the diagram below. We’re essentially using the symmetry of a square (in principle) to make an actual square.||Một hình vuông có nhiều tính đối xứng hơn một hình chữ nhật, bởi vì chúng ta có thể gấp một hình vuông dọc theo một đường chéo và hai cạnh sẽ trùng khít nhau, nhưng điều này không đúng với một hình chữ nhật tổng quát.[^1] Trên thực tế, điều này mang lại một cách tiện dụng để tạo ra một hình vuông từ một tờ giấy hình chữ nhật mà không cần phải dùng thước kẻ: gập một góc xuống như trong hình vẽ dưới đây. Về bản chất, chúng ta đang sử dụng tính đối xứng của một hình vuông (về mặt nguyên lý) để tạo ra một hình vuông thực tế.
IMG||ismathreal-00232.jpg
P||We can move on and develop our understanding of symmetry by including other types. The 'folding' type is called reflectional symmetry because it’s a bit like reflecting one part of the shape onto another as if with a mirror. Another type of symmetry is more like a windmill, where you can rotate a shape so that one part lands on another. This is called rotational symmetry.||Chúng ta có thể tiến xa hơn và phát triển sự hiểu biết của mình về tính đối xứng bằng cách đưa vào các loại khác. Loại "gập" được gọi là đối xứng phản xạ (đối xứng trục) bởi vì nó hơi giống như việc phản chiếu một phần của hình thể lên một phần khác như thể qua một chiếc gương. Một loại đối xứng khác giống như một chiếc cối xay gió hơn, nơi bạn có thể xoay một hình để một phần này đáp xuống trùng khít với một phần khác. Đây được gọi là đối xứng quay.
IMG||ismathreal-00112.jpg
P||Squares and rectangles have both types of symmetry, and we can then even think of combining symmetries to see what happens. This leads to the topic of group theory, which makes abstract structures out of symmetries and how they are combined. Once we are there, we realise there are other things we can study in a similar way that are a bit like symmetry but do not involve shapes, taking us another level up our spiral staircase. One example is symmetry in words, that is, palindromes such as||Hình vuông và hình chữ nhật đều có cả hai loại đối xứng, và sau đó chúng ta thậm chí có thể nghĩ đến việc kết hợp các phép đối xứng để xem điều gì sẽ xảy ra. Điều này dẫn đến chủ đề lý thuyết nhóm, một lĩnh vực tạo ra các cấu trúc trừu tượng từ các phép đối xứng và cách chúng được kết hợp. Một khi đã ở đó, chúng ta nhận ra có những thứ khác mà chúng ta có thể nghiên cứu theo cách tương tự – những thứ hơi giống tính đối xứng nhưng không liên quan đến hình dạng, đưa chúng ta lên một nấc thang khác trên cầu thang xoắn ốc. Một ví dụ là tính đối xứng trong các từ ngữ, tức là các từ xuôi ngược đều giống nhau (palindromes) chẳng hạn như:
BQ||Madam, I’m Adam<br><br>A man, a plan, a canal, Panama<br><br>Taco cat||Madam, I’m Adam<br><br>A man, a plan, a canal, Panama<br><br>Taco cat
P||We’re quite good at recognising that these can be read backwards, producing the same thing as reading them forwards, even though it involves a little bit of ignoring of spaces and punctuation. There’s a type of symmetry in equations too. For example if you look at this expression||Chúng ta khá giỏi trong việc nhận ra rằng những câu này có thể đọc ngược lại mà vẫn tạo ra nội dung y hệt như khi đọc xuôi, ngay cả khi điều đó đòi hỏi một chút phớt lờ đối với dấu cách và dấu câu. Cũng có một kiểu đối xứng trong các phương trình. Ví dụ nếu bạn nhìn vào biểu thức này:
BQ||a² + ab + b²||a² + ab + b²
P||the a and the b are playing analogous roles in there. That is, if we swap a and b everywhere in that expression we get||thì a và b đang đóng các vai trò tương đương trong đó. Nghĩa là, nếu chúng ta hoán đổi a và b ở mọi nơi trong biểu thức đó, chúng ta sẽ nhận được:
BQ||b² + ba + a²||b² + ba + a²
P||which is the same as the first expression (provided the order in which we do addition and multiplication doesn’t matter). This is another type of symmetry, which is studied in a field called Galois theory. So we’ve now moved on to including expressions involving letters in our maths. (If the letters make you nervous, I sympathise; we’ll come back to what the letters are doing there later.)||biểu thức này giống hệt biểu thức ban đầu (với điều kiện thứ tự chúng ta thực hiện phép cộng và phép nhân không quan trọng). Đây là một kiểu đối xứng khác, được nghiên cứu trong một lĩnh vực gọi là lý thuyết Galois. Vì vậy, giờ đây chúng ta đã chuyển sang việc đưa các biểu thức chứa các chữ cái vào toán học của mình. (Nếu những chữ cái làm bạn thấy bất an, tôi hoàn toàn đồng cảm; chúng ta sẽ quay lại với việc những chữ cái đang làm gì ở đó sau.)
P||We then develop more ways to think about those expressions involving letters, maybe by thinking really hard about the relationships they might have with shapes. So where previously we studied shapes, and we also studied expressions in letters, we now think about the relationship between those things. This leads us to my research field, the field of category theory. This is a subject that focuses on relationships between things, and pushes that idea further and further so that we can study relationships between almost anything. Moreover, we can start to regard things as 'relationships', even if they weren’t originally relationships, in order to study them in a similar way. For example, we can regard symmetry as a relationship between an object and itself, which might sound bizarre but turns out to be a very fruitful little bit of mental gymnastics.||Sau đó, chúng ta phát triển nhiều cách hơn để tư duy về những biểu thức chứa chữ cái đó, có thể bằng cách suy nghĩ thật sâu sắc về mối quan hệ mà chúng có thể có với các hình khối. Vì vậy, nếu như trước đây chúng ta nghiên cứu các hình dạng, và chúng ta cũng nghiên cứu các biểu thức bằng chữ cái, thì bây giờ chúng ta nghĩ về mối quan hệ giữa những thứ đó. Điều này dẫn chúng ta đến lĩnh vực nghiên cứu của tôi: lý thuyết phạm trù. Đây là một bộ môn tập trung vào các mối quan hệ giữa các sự vật, và thúc đẩy ý tưởng đó đi xa hơn nữa để chúng ta có thể nghiên cứu mối quan hệ giữa hầu như bất kỳ thứ gì. Hơn nữa, chúng ta có thể bắt đầu coi các sự vật như là "những mối quan hệ", ngay cả khi ban đầu chúng không phải là mối quan hệ, để nghiên cứu chúng theo cách tương tự. Ví dụ, chúng ta có thể coi tính đối xứng như một mối quan hệ giữa một vật thể và chính nó, điều nghe có vẻ kỳ dị nhưng hóa ra lại là một màn thể dục trí não rất đỗi hữu ích.
P||And this is a crucial point: that because maths starts with abstraction, we can study more things mathematically if we think of new ways to perform an abstraction. This will bring more examples into our analogy that previously didn’t seem to be there. This is different from studying, say, dolphins, where you can’t exactly go round regarding things as dolphins in order to study them as dolphins if they aren’t already dolphins. But with an abstract concept like a relationship, you can do that. We can regard symmetry as a relationship between an object and itself. We can regard train journeys as a relationship between the starting point and the destination. We can regard numbers as relationships between other numbers, such as 3 being a relationship between 2 and 5 as it’s the difference between them.||Và đây là một điểm mấu chốt: bởi vì toán học bắt đầu bằng sự trừu tượng hóa, chúng ta có thể nghiên cứu nhiều thứ hơn dưới góc độ toán học nếu chúng ta nghĩ ra những cách mới để thực hiện sự trừu tượng hóa. Điều này sẽ mang lại nhiều ví dụ hơn vào phép tương đồng của chúng ta mà trước đây dường như không có ở đó. Điều này khác với việc nghiên cứu, chẳng hạn như cá heo, nơi bạn không thể đi loanh quanh coi mọi thứ là cá heo để nghiên cứu chúng như cá heo nếu chúng vốn dĩ không phải là cá heo. Nhưng với một khái niệm trừu tượng như một mối quan hệ, bạn hoàn toàn có thể làm điều đó. Chúng ta có thể coi tính đối xứng là một mối quan hệ giữa một vật thể và chính nó. Chúng ta có thể coi các chuyến đi bằng tàu hỏa là mối quan hệ giữa điểm xuất phát và điểm đến. Chúng ta có thể coi các con số là mối quan hệ giữa các con số khác, chẳng hạn như 3 là mối quan hệ giữa 2 và 5 vì nó là hiệu số giữa chúng.
P||In this way, the starting point for maths is the mental gymnastics of finding ways to think flexibly about situations, in order to make connections between things that didn’t previously seem related. And having a vivid and creative imagination is very helpful in conjuring those connections into being.||Bằng cách này, điểm khởi đầu cho toán học chính là bài tập thể dục trí não nhằm tìm ra những cách thức tư duy linh hoạt về các tình huống, nhằm tạo ra sự liên kết giữa những thứ mà trước đây dường như không liên quan. Và việc có một trí tưởng tượng sống động và sáng tạo sẽ vô cùng hữu ích trong việc gợi mở những mối liên kết đó thành hiện thực.
H2||MAKING CONNECTIONS||TẠO DỰNG CÁC MỐI LIÊN KẾT
P||Abstraction sounds like a process of moving further away from the concrete world, but really it’s a way of making analogies between things, that is, finding connections. I really love finding connections between things. I love making connections between people. I love it when pieces of music remind me of other pieces of music. I love it when it dawns on me that an actor in one film is the same as one in another film I’ve seen, when it’s not very obvious, like when Crispin Bonham-Carter played Mr Bingley in the BBC Pride and Prejudice and then popped up in Casino Royale. I particularly love spotting similarities between situations and realising it means I’ve already understood this situation in a different context, so I don’t have to start from scratch. This is how Miss Marple solves murder mysteries in Agatha Christie’s books, and I enjoy those too.||Sự trừu tượng hóa nghe có vẻ giống như một quá trình rời xa thế giới cụ thể, nhưng thực chất nó là một cách tạo ra sự tương đồng giữa các sự vật, tức là tìm kiếm các mối liên kết. Tôi thực sự rất thích việc tìm kiếm các mối liên kết giữa vạn vật. Tôi thích tạo ra các mối liên hệ giữa mọi người. Tôi thích khi những bản nhạc gợi cho tôi nhớ đến những bản nhạc khác. Tôi thích khi bất chợt nhận ra rằng một diễn viên trong bộ phim này cũng chính là người trong một bộ phim khác mà tôi từng xem, khi điều đó không quá hiển nhiên, chẳng hạn như khi Crispin Bonham-Carter đóng vai Mr Bingley trong bộ phim <em>Pride and Prejudice</em> của đài BBC rồi sau đó lại xuất hiện trong <em>Casino Royale</em>. Tôi đặc biệt thích việc phát hiện ra những điểm tương đồng giữa các tình huống và nhận ra điều đó có nghĩa là tôi đã hiểu tình huống này trong một bối cảnh khác rồi, vì vậy tôi không cần phải bắt đầu lại từ con số không. Đây là cách Quý bà Marple giải quyết các vụ án mạng bí ẩn trong sách của Agatha Christie, và tôi cũng rất thích những cuốn sách đó.
P||In life we are often quite wrapped up with finding differences between things. We emphasise differences between people’s experiences to make sure that we are not treating everyone of the same race as a monolith, or assuming that all women vote the same way. We point out not just the ways in which someone is in an oppressed minority, but also the ways in which different oppressed minorities are oppressed differently, especially those in the intersection of several minorities, to make sure we are not erasing people’s experiences.||Trong cuộc sống, chúng ta thường khá bận tâm với việc tìm kiếm sự khác biệt giữa vạn vật. Chúng ta nhấn mạnh sự khác biệt giữa trải nghiệm của mọi người để đảm bảo rằng chúng ta không coi tất cả những người cùng một chủng tộc là một khối đồng nhất, hoặc cho rằng tất cả phụ nữ đều bỏ phiếu theo cùng một cách. Chúng ta không chỉ chỉ ra những phương diện mà một ai đó thuộc về một nhóm thiểu số bị áp bức, mà còn cả những cách thức mà các nhóm thiểu số bị áp bức khác nhau phải chịu áp bức theo những cách khác nhau ra sao, đặc biệt là những người nằm ở giao lộ của nhiều nhóm thiểu số, để đảm bảo rằng chúng ta không xóa bỏ trải nghiệm của mọi người.
P||That is all important, but it’s also important not to lose sight of connections between us. In fact, I’m convinced that strengthening our connections is crucial if we want to loosen the grip that white patriarchy has over society. Fragmentation of minorities into more and more disparate groups works in favour of the white patriarchy, which can only hold on to power if individual minorities do not work together to change those power structures. If individual minorities build enough connections to work together, then they become a majority.||Tất cả những điều đó đều quan trọng, nhưng việc không đánh mất đi những mối liên kết giữa chúng ta cũng quan trọng không kém. Trên thực tế, tôi tin chắc rằng việc củng cố các mối liên kết của chúng ta là tối quan trọng nếu chúng ta muốn nới lỏng sự kìm kẹp mà chế độ phụ quyền da trắng đang áp đặt lên xã hội. Sự phân mảnh của các nhóm thiểu số thành những nhóm ngày càng rời rạc sẽ có lợi cho chế độ phụ quyền da trắng – vốn chỉ có thể nắm giữ quyền lực nếu các nhóm thiểu số riêng lẻ không cùng nhau hợp tác để thay đổi các cấu trúc quyền lực đó. Nếu các nhóm thiểu số riêng lẻ xây dựng đủ các mối liên kết để hợp tác cùng nhau, thì họ sẽ trở thành đa số.
P||In maths we don’t do one or other of these things, but we remain ever flexible in our thinking: we point out senses in which things are connected, and also senses in which things are different. And we don’t remain fixed in that point of view, we just take that point of view to see what we can learn from it, and then take another point of view to see what we can learn from that. This is a very different feeling of 'doing maths' from the one that feels like a rigid system of rules you have to follow.||Trong toán học, chúng ta không chỉ làm một trong hai điều này, mà chúng ta luôn duy trì sự linh hoạt trong tư duy: chúng ta chỉ ra những ý niệm mà ở đó mọi thứ được kết nối, và cả những ý niệm mà ở đó mọi thứ khác biệt. Và chúng ta không cố định trong góc nhìn đó, chúng ta chỉ tiếp nhận góc nhìn đó để xem mình có thể học được gì từ nó, rồi sau đó lại đón nhận một góc nhìn khác để xem mình có thể học được gì từ góc nhìn mới. Đây là một cảm giác rất khác về việc "làm toán" so với cảm giác coi toán học như một hệ thống các quy tắc cứng nhắc mà bạn buộc phải tuân theo.
P||Finding a sense in which things are the same is a starting point, a launch pad for us to be able to study different things at once, as when we first move into the world of numbers.||Việc tìm kiếm một ý niệm mà ở đó các sự vật là như nhau chính là một điểm khởi đầu, một bệ phóng để chúng ta có thể nghiên cứu các sự vật khác nhau cùng một lúc, giống như khi chúng ta lần đầu tiên bước vào thế giới của các con số.
P||Another example is with shapes, where we think about shapes that aren’t exactly the same, but perhaps are just scaled versions of each other, like these two triangles:||Một ví dụ khác là với các hình khối, nơi chúng ta nghĩ về các hình dạng không hoàn toàn giống hệt nhau, nhưng có lẽ chỉ là các phiên bản phóng to thu nhỏ của nhau, giống như hai hình tam giác này:
IMG||ismathreal-00233.jpg
P||In some situations, we need to count triangles as the same only if they’re exactly the same in every way. For example, if we’re fitting pieces together, then only the exact correct triangle will fit. This gives us the version of sameness called 'congruence'.||Trong một số tình huống, chúng ta chỉ cần coi các hình tam giác là như nhau nếu chúng hoàn toàn giống nhau về mọi mặt. Ví dụ, nếu chúng ta đang lắp ghép các mảnh lại với nhau, thì chỉ có đúng hình tam giác chuẩn xác mới khớp được. Điều này mang lại cho chúng ta một phiên bản của sự giống nhau gọi là "sự bằng nhau" (tương đẳng).
P||In other situations, it doesn’t matter how big the triangle is – for example, if we’re just trying to calculate an angle, or if we’re scaling an entire situation. So we get the notion of similar triangles, which can be scaled versions of each other like the ones above – it just matters that they are scaled entirely in proportion, which results in them having the same angles, and the same proportions between their three sides.||Trong các tình huống khác, việc tam giác lớn đến mức nào không quan trọng – ví dụ, nếu chúng ta chỉ đang cố gắng tính một góc, hoặc nếu chúng ta đang thu phóng toàn bộ một tình huống. Do đó, chúng ta có khái niệm về các tam giác đồng dạng, có thể là các phiên bản tỷ lệ của nhau như những hình tam giác ở trên – điều quan trọng là chúng được thu phóng hoàn toàn theo đúng tỷ lệ, dẫn đến việc chúng có các góc bằng nhau, và cùng một tỷ lệ giữa ba cạnh của chúng.
P||In yet other situations, it doesn’t even matter what shape the triangle is, as long as it’s some kind of triangle. For example, if we’re just trying to make a rectangular picture frame rigid, we need to put some cross-bars on the back to make a triangle shape at each corner. It doesn’t matter what shape the triangles are.||Ở những tình huống khác nữa, hình dạng của tam giác thậm chí còn chẳng quan trọng, miễn là nó là một loại tam giác nào đó. Ví dụ, nếu chúng ta chỉ đang cố gắng làm cho một khung tranh hình chữ nhật trở nên cứng cáp, chúng ta cần đặt một số thanh giằng chéo ở phía sau để tạo thành hình tam giác ở mỗi góc. Các hình tam giác đó có hình dạng như thế nào không quan trọng.
IMG||ismathreal-00113.jpg
P||This is how we get to the notion of 'triangle' in the first place: it’s just a shape made from three straight edges, thus having three angles.||Đây là cách chúng ta đi đến khái niệm "hình tam giác" ngay từ đầu: nó chỉ đơn giản là một hình được tạo thành từ ba cạnh thẳng, do đó có ba góc.
P||The study of congruent and similar triangles might seem pointless and contrived if we’re just asking whether or not triangles are congruent, similar, or neither; much more interesting to me is the question of in what context we care about these different types of 'sameness' for triangles. There are even contexts in which more things count as triangles. In abstract mathematics, we consider it acceptable for triangles to have one or more sides of length zero. Moreover, not only is it acceptable, but it’s crucial for some constructions that those count as triangles. They are called 'degenerate' triangles. So the shapes below actually count as triangles even though they look like a line and a dot, which I find quite satisfyingly subversive.||Việc nghiên cứu các tam giác bằng nhau và đồng dạng có vẻ vô nghĩa và gượng ép nếu chúng ta chỉ hỏi liệu các tam giác có bằng nhau, đồng dạng hay không phải cả hai; điều thú vị hơn nhiều đối với tôi là câu hỏi trong bối cảnh nào thì chúng ta quan tâm đến các loại "sự giống nhau" khác nhau này đối với các hình tam giác. Thậm chí có những bối cảnh mà nhiều thứ hơn cũng được tính là hình tam giác. Trong toán học trừu tượng, chúng ta coi việc tam giác có một hoặc nhiều cạnh có độ dài bằng không là điều hoàn toàn chấp nhận được. Hơn nữa, điều đó không chỉ được chấp nhận, mà còn mang tính cốt tử đối với một số cấu trúc đòi hỏi những thứ đó phải được tính là tam giác. Chúng được gọi là các tam giác "suy biến". Vì vậy, các hình dưới đây thực sự được tính là hình tam giác mặc dù chúng trông giống như một đoạn thẳng và một dấu chấm, điều mà tôi thấy mang tính phá cách khá thỏa mãn.

P||The second one has all three sides with length zero, so the whole thing has shrunk down to a point.||Hình thứ hai có cả ba cạnh đều có độ dài bằng không, vì vậy toàn bộ hình đã co lại thành một điểm.
P||In my field of research, category theory, we call things a 'triangle' if they have three sides, regardless of whether or not the sides are drawn with a straight edge. This is because in category theory we only care about relationships between things, and the shapes we draw are representing abstract relationships. For example, this relationship||Trong lĩnh vực nghiên cứu của tôi, lý thuyết phạm trù, chúng tôi gọi các vật thể là một "hình tam giác" nếu chúng có ba cạnh, bất kể các cạnh đó có được vẽ bằng một đường thẳng hay không. Điều này là do trong lý thuyết phạm trù, chúng tôi chỉ quan tâm đến các mối quan hệ giữa các sự vật, và các hình dạng chúng tôi vẽ đại diện cho các mối quan hệ trừu tượng. Ví dụ, mối quan hệ này

P||That might sound weird, but perhaps you’d be comfortable if I described the following scenario: when I was a grad student I basically lived my life going in a triangle between my room, my college and the maths department. Now, I’ve called it a 'triangle' but of course I did not actually walk in a straight line between those places, because that’s not how the streets were laid out. But it still felt like a triangle, although it was actually like this:[^2]||Điều đó nghe có vẻ kỳ quặc, nhưng có lẽ bạn sẽ thấy thoải mái nếu tôi mô tả kịch bản sau: khi tôi còn là một nghiên cứu sinh, cuộc sống của tôi về cơ bản diễn ra theo một hình tam giác giữa phòng trọ, trường đại học thành viên và khoa toán. Bây giờ, tôi gọi nó là một "hình tam giác" nhưng dĩ nhiên là tôi không thực sự đi bộ theo một đường thẳng tắp giữa những địa điểm đó, vì các đường phố đâu có được bố trí như vậy. Nhưng cảm giác của nó vẫn giống như một hình tam giác, mặc dù trên thực tế nó trông như thế này:[^2]
IMG||ismathreal-00239.jpg
P||This discipline of finding senses in which things are the same and different is the starting point of all maths, and it also comes in when we’re thinking about when one plus one is and isn’t two. We start by practising this discipline with something fairly simple like triangles before moving on to things that are more complex. Unfortunately the simple things can seem pointless if nobody explains what we’re trying to practise. Once we’re well practised, it becomes much easier to see connections in more complicated situations, such as the spread of viruses.||Kỷ luật tìm kiếm các ý niệm mà ở đó mọi thứ giống nhau và khác nhau này là điểm khởi đầu của mọi nền toán học, và nó cũng xuất hiện khi chúng ta nghĩ về việc khi nào thì một cộng một bằng và không bằng hai. Chúng ta bắt đầu bằng cách thực hành kỷ luật này với một thứ gì đó khá đơn giản như các hình tam giác trước khi chuyển sang những thứ phức tạp hơn. Thật không may, những điều đơn giản có thể dường như vô nghĩa nếu không có ai giải thích chúng ta đang cố gắng thực hành điều gì. Một khi chúng ta đã thực hành nhuần nhuyễn, việc nhìn thấy các mối liên kết trong những tình huống phức tạp hơn sẽ trở nên dễ dàng hơn nhiều, chẳng hạn như sự lây lan của virus.
P||Viral illnesses spread by repeated multiplication. The idea is that each infected person infects a certain number of people, on average. Let’s suppose that number is 3. Then those 3 people each infect 3 people (on average), which makes 3 × 3 = 9. Those 9 people infect 3 people each, which makes 3 × 9 = 27. At each stage the total number of new infections multiplies by 3.||Các bệnh do virus lây lan bằng phép nhân lặp đi lặp lại. Ý tưởng là mỗi người bị nhiễm bệnh sẽ lây cho một số lượng người nhất định, tính theo mức trung bình. Hãy giả sử con số đó là 3. Khi đó, 3 người đó mỗi người lại lây cho 3 người (trung bình), tạo thành 3 × 3 = 9. 9 người đó mỗi người lại lây cho 3 người, tạo thành 3 × 9 = 27. Ở mỗi giai đoạn, tổng số ca nhiễm mới được nhân lên với 3.
P||Repeated multiplication is something that mathematicians study abstractly, just like they study repeated addition. Repeated multiplication produces exponentials, and this is a crucial point: if we say something 'increases exponentially' in normal life, we might just mean it increases rapidly. But in maths this means something very specific: it means it increases by repeated multiplication. This does indeed make for rapid increases, but rapid in a precise way that we can then study using other techniques. Among other things, this is how the spread of viruses in different conditions can be studied and predicted, even when it seems to be spreading very slowly at the beginning when the numbers are small. The graph of an exponential looks like this:||Phép nhân lặp đi lặp lại là thứ mà các nhà toán học nghiên cứu một cách trừu tượng, giống như cách họ nghiên cứu phép cộng lặp đi lặp lại. Phép nhân lặp đi lặp lại tạo ra hàm mũ, và đây là một điểm mấu chốt: nếu chúng ta nói một thứ gì đó "tăng theo cấp số nhân" (tăng theo hàm mũ) trong cuộc sống đời thường, chúng ta có thể chỉ có ý nói rằng nó tăng lên nhanh chóng. Nhưng trong toán học, điều này mang một ý nghĩa rất cụ thể: nó có nghĩa là nó tăng lên bằng phép nhân lặp đi lặp lại. Điều này thực sự tạo ra sự gia tăng nhanh chóng, nhưng nhanh chóng theo một cách chính xác mà sau đó chúng ta có thể nghiên cứu bằng các kỹ thuật khác. Cùng với những thứ khác, đây là cách sự lây lan của virus trong các điều kiện khác nhau có thể được nghiên cứu và dự đoán, ngay cả khi ban đầu nó dường như lây lan rất chậm khi các con số còn nhỏ. Đồ thị của một hàm mũ trông như thế này:

P||As you can see it’s very flat at the beginning and then takes off rather dramatically later on. Studying exponentials abstractly enables scientists to have a better understanding of virus outbreaks even early on when the numbers don’t seem too bad; unfortunately those who don’t understand exponentials think that this is just fear-mongering.||Như bạn có thể thấy, nó rất phẳng ở phần đầu và sau đó bứt phá một cách khá đột ngột về sau. Việc nghiên cứu trừu tượng các hàm mũ cho phép các nhà khoa học hiểu rõ hơn về các đợt bùng phát virus ngay từ giai đoạn đầu khi các con số có vẻ chưa quá tồi tệ; thật không may, những người không hiểu về hàm mũ lại nghĩ rằng đây chỉ là sự gieo rắc nỗi sợ hãi vô căn cứ.
P||This turns out to be related to viral videos. When a video 'goes viral' it’s often something of a surprise and it happens rather suddenly. The point is that this can be modelled abstractly just like the spread of viral illnesses, but instead of infection, we’re thinking about how the video is shared. So each person shares the video and that causes a certain number of their friends or followers to share it in turn. Even if that number is quite small, say 3, on average, then if the process keeps going the numbers will quickly become large because of how exponentials work. It only takes thirteen steps to get us past a million.||Hóa ra điều này cũng liên quan đến các video lan truyền nhanh chóng (viral video). Khi một video "trở nên viral", nó thường là một điều gì đó bất ngờ và xảy ra khá đột ngột. Vấn đề là điều này có thể được mô hình hóa một cách trừu tượng giống như sự lây lan của các bệnh do virus, nhưng thay vì lây nhiễm, chúng ta đang nghĩ về cách video được chia sẻ. Vì vậy, mỗi người chia sẻ video và điều đó khiến cho một số lượng bạn bè hoặc người theo dõi nhất định của họ lần lượt chia sẻ tiếp. Ngay cả khi con số đó khá nhỏ, chẳng hạn như trung bình là 3, thì nếu quá trình này tiếp tục diễn ra, các con số sẽ nhanh chóng trở nên khổng lồ vì cách thức hoạt động của hàm mũ. Chỉ mất mười ba bước để đưa chúng ta vượt qua con số một triệu.
P||Exponentials govern all sorts of other situations that might otherwise seem unrelated, such as the temperature of a joint of meat as it’s cooking. You can buy a meat thermometer gadget that not only takes the temperature of your meat as it’s cooking, but also connects to an app which then predicts how much longer it needs to cook before it gets to your desired internal temperature. This is a calculation involving exponentials. Radioactive decay also involves exponentials, but this time it’s something that is repeatedly multiplied by a number less than 1, so it keeps getting smaller.||Hàm mũ chi phối đủ loại tình huống khác mà nếu không để ý có thể dường như không liên quan, chẳng hạn như nhiệt độ của một tảng thịt khi đang nấu. Bạn có thể mua một thiết bị nhiệt kế đo thịt không chỉ đo nhiệt độ miếng thịt khi đang nấu, mà còn kết nối với một ứng dụng để dự đoán thời gian miếng thịt cần nấu thêm bao lâu nữa trước khi đạt đến nhiệt độ bên trong mong muốn của bạn. Đây là một phép tính liên quan đến hàm mũ. Sự phân rã phóng xạ cũng liên quan đến hàm mũ, nhưng lần này là một thứ liên tục được nhân với một số nhỏ hơn 1, vì vậy nó cứ nhỏ dần đi.
P||There are some differences between these situations as well, besides the fact that some of them are more life-threatening than others. For both the viral illnesses and the viral videos, there is a constraint on the spread which comes from the total population available to be infected (or affected). Once a certain proportion of the population is infected (or has seen the video) the spread will slow down even if we don’t intervene to stop it, just because there aren’t very many people left. This doesn’t really happen when you’re cooking meat – although I suppose if you leave it in there for a really long time it will eventually burn and disintegrate. It does happen any time the exponential growth is constrained by a limited resource, which is also the case with population growth as a population will eventually start running out of food resources. The model of exponential growth limited by a constrained resource is more subtle than plain exponential growth. It was originally studied by Belgian mathematician Pierre François Verhulst in the mid-nineteenth century, and it produces a graph like this:||Cũng có một số điểm khác biệt giữa các tình huống này, bên cạnh thực tế là một số tình huống đe dọa đến tính mạng nhiều hơn những tình huống khác. Đối với cả các bệnh do virus và các video lan truyền, có một sự hạn chế đối với sự lây lan bắt nguồn từ tổng quy mô dân số sẵn có để bị lây nhiễm (hoặc bị tác động). Một khi một tỷ lệ nhất định của dân số đã bị nhiễm (hoặc đã xem video), sự lây lan sẽ chậm lại ngay cả khi chúng ta không can thiệp để ngăn chặn nó, đơn giản là vì không còn nhiều người còn lại nữa. Điều này không thực sự xảy ra khi bạn nấu thịt – mặc dù tôi cho rằng nếu bạn để nó trong lò quá lâu thì cuối cùng nó sẽ cháy đen và tan thành tro bụi. Nó thực sự xảy ra bất cứ khi nào sự tăng trưởng theo hàm mũ bị hạn chế bởi một nguồn tài nguyên có hạn, điều này cũng đúng với sự gia tăng dân số vì một quần thể cuối cùng sẽ bắt đầu cạn kiệt nguồn lương thực. Mô hình tăng trưởng theo hàm mũ bị giới hạn bởi một nguồn tài nguyên hữu hạn tinh tế hơn so với sự tăng trưởng theo hàm mũ đơn thuần. Ban đầu nó được nghiên cứu bởi nhà toán học người Bỉ Pierre François Verhulst vào giữa thế kỷ XIX, và nó tạo ra một đồ thị như thế này:

P||All this is to say that the maths of these situations involves both finding similarities between the situations and also working out where the differences are, so that we don’t try and push analogies further than is appropriate. This approach also helps us avoid pushing the concept of 'correct answer' further than is appropriate. Instead, we find similarities between situations in which something is true, and use those as clues to help us understand what is making that thing true in those particular contexts. This is how we explore different possible answers to 1 + 1.||Tất cả những điều này muốn nói rằng toán học của những tình huống này bao gồm cả việc tìm ra những điểm tương đồng giữa các tình huống và tìm ra điểm khác
