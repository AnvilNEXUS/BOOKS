H1||1. WHERE MATHS COMES FROM||1. TOÁN HỌC BẮT NGUỒN TỪ ĐÂU
P||Why does 1 + 1 = 2?||Tại sao 1 + 1 = 2?
P||One possible answer to this question is 'It just does!' That is really a variation on 'Because I say so!' – an answer that has been frustrating children for generations. 'Because I say so' means that there is an authority figure who makes the rules, that they don’t have to justify their rules but can make up any rules they want, and everyone else is a minion who just has to follow those rules.||Một câu trả lời khả dĩ cho câu hỏi này là: "Nó vốn thế thôi!" Đó thực chất là một biến thể của câu "Bởi vì ta bảo thế!" – một câu trả lời đã làm trẻ con bao thế hệ phải ấm ức. "Bởi vì ta bảo thế" hàm ý rằng có một nhân vật quyền uy đặt ra các luật lệ, rằng họ chẳng cần phải biện minh cho những luật lệ của mình mà có thể tự ý bịa ra bất cứ điều gì họ muốn, và tất cả những người khác chỉ là những kẻ thừa hành buộc phải răm rắp tuân theo.
P||It is quite right to feel frustrated by that idea. In fact, a strong mathematical impulse is to immediately want to break all the rules, or find sneaky situations in which those rules don’t hold, to show that the supposed authority figure doesn’t have quite as much authority as they think.||Cảm thấy bực bội trước ý nghĩ đó là điều hoàn toàn chính đáng. Trên thực tế, một thôi thúc toán học mạnh mẽ là ngay lập tức muốn phá vỡ mọi quy tắc, hoặc tìm kiếm những tình huống tinh quái mà ở đó các quy tắc không còn đúng nữa, nhằm chứng minh rằng nhân vật tự cho là có quyền uy kia chẳng hề có nhiều thẩm quyền như họ tưởng.
P||Maths can seem like a world of rules you just have to follow, which makes it seem rigid and boring. By contrast, my love of maths is somewhat driven by my love of breaking rules, or at least pushing against them. I’m a bit sheepish about that as it makes me sound a bit like an adolescent who never grew up. My love of maths is also driven by my wanting to keep asking 'Why?' about everything, which in turn makes me feel like a toddler who never grew up. But both of those impulses play an important role in advancing human understanding, and in particular mathematical understanding. Those impulses are an important part of the origins of maths, which is what we’ll be looking at in this chapter.||Toán học có thể mang lại cảm giác như một thế giới của những quy tắc mà bạn chỉ việc tuân theo, điều khiến nó trở nên cứng nhắc và buồn tẻ. Ngược lại, tình yêu toán học của tôi một phần lại bắt nguồn từ sở thích phá vỡ các quy tắc, hoặc chí ít là thách thức, xô đẩy chúng. Tôi hơi ngượng ngùng về điều đó vì nghe chừng tôi giống như một đứa trẻ mới lớn chẳng bao giờ chịu trưởng thành. Tình yêu toán học của tôi cũng được thúc đẩy bởi việc tôi luôn muốn không ngừng hỏi "Tại sao?" về mọi thứ, điều này lại khiến tôi cảm thấy mình giống như một đứa trẻ chập chững biết đi không bao giờ chịu lớn. Nhưng cả hai thôi thúc đó đều đóng một vai trò quan trọng trong việc thúc đẩy sự hiểu biết của con người, và đặc biệt là sự hiểu biết về toán học. Những thôi thúc ấy chính là một phần quan trọng trong nguồn gốc của toán học – điều mà chúng ta sẽ cùng khám phá trong chương này.
P||I’d like to stress that in normal life I am a very law-abiding person because I understand rules that are about holding a community together and keeping people safe. I believe in those rules. I don’t mind following rules that have a purpose; the rules I don’t believe in are the arbitrary ones that don’t seem to have a justification, or whose justification I don’t believe in. Rules like 'You must make your bed every day' (which really isn’t to my taste) or 'Never melt chocolate in a microwave' (it’s certainly easy to ruin it, but as long as you stir it every 15 seconds without fail I’ve found it’s fine).||Tôi muốn nhấn mạnh rằng trong cuộc sống đời thường, tôi là một người rất mực tuân thủ luật pháp, bởi vì tôi hiểu rằng các quy tắc sinh ra là để gắn kết cộng đồng và giữ cho mọi người được an toàn. Tôi tin vào những quy tắc đó. Tôi không ngại tuân theo những quy luật có mục đích; những quy tắc mà tôi không tin là những quy tắc độc đoán, dường như chẳng có lý do xác đáng nào, hoặc những lý lẽ mà tôi không thể tin phục. Những quy tắc như "Con phải dọn giường mỗi ngày" (điều thực sự chẳng hợp với sở thích của tôi chút nào) hay "Không bao giờ được làm tan chảy sô-cô-la trong lò vi sóng" (chắc chắn là rất dễ làm hỏng nó, nhưng miễn là bạn khuấy đều đặn mỗi 15 giây một lần không trượt phát nào thì tôi thấy nó vẫn hoàn toàn ổn).
P||So I want to look at where the apparent 'rules' of maths come from, and indeed where maths comes from at all. I’ll describe how it starts from small seeds and then grows to great heights in an organic way. The seeds are naive questions that any of us might pose, and that small children often pose innocently, like when they wonder why 1 + 1 is 2, rather than just being content to know that it is. Like any seeds, they need to be nurtured in the right way to grow. They need a fertile soil, space to plant their roots, and then nourishment. Unfortunately our innocent questions are too often not nurtured in this way, but dismissed as 'stupid' and tossed aside. But the difference between deep mathematical questions and innocent ones might only be the nurturing – that is, there is no difference. It’s the same seeds.||Vì vậy, tôi muốn xem xét xem những "quy tắc" bề ngoài của toán học bắt nguồn từ đâu, và thực sự thì toán học khởi nguồn từ đâu. Tôi sẽ mô tả cách nó bắt đầu từ những hạt mầm nhỏ bé rồi sau đó vươn lên tầm cao lớn lao theo một cách thức hữu cơ tự nhiên. Những hạt mầm ấy là những câu hỏi ngây thơ mà bất kỳ ai trong chúng ta cũng có thể đặt ra, và những đứa trẻ nhỏ thường hồn nhiên cất lên, chẳng hạn như khi chúng thắc mắc tại sao 1 + 1 lại bằng 2, thay vì chỉ hài lòng với việc biết rằng nó là như vậy. Giống như bất kỳ hạt giống nào, chúng cần được nuôi dưỡng đúng cách để phát triển. Chúng cần một mảnh đất màu mỡ, không gian để cắm rễ, và sau đó là chất dinh dưỡng. Thật không may, những câu hỏi ngây thơ của chúng ta lại quá thường xuyên không được nuôi dưỡng theo cách này, mà bị gạt phắt đi như những điều "ngớ ngẩn" và bị quẳng sang một bên. Nhưng sự khác biệt giữa những câu hỏi toán học sâu sắc và những câu hỏi ngây thơ có lẽ chỉ nằm ở sự nuôi dưỡng – nghĩa là, thực chất chẳng có gì khác biệt cả. Chúng đều là cùng một hạt mầm.
P||People who don’t like maths are often put off by the apparently autocratic declaration that something is the right answer, without explanation. 'One plus one just is two.' But wondering why something is true leads us to build strong foundations for mathematics, so that we can make clear and rigorous arguments. Some people find this clarity and reliability relaxing and liberating, while others find it restrictive and autocratic. But a question like 'Why does 1 + 1 = 2?' allows us to explore the idea that maths doesn’t have clear right answers, but rather, different contexts in which different things can be true. This is going to lead us to explore where numbers come from in the first place, how we come to the ideas of arithmetic, and how we can then use those ideas in other mathematical contexts such as when we’re thinking about shapes. This touches on many important themes in how maths is developed, starting with making connections between things, taking abstraction seriously, and then expanding our thought processes to encompass more of the world around us, little by little.||Những người không thích toán thường cảm thấy nản lòng trước những lời tuyên bố có vẻ độc đoán rằng một thứ gì đó là câu trả lời đúng mà không hề có lời giải thích. "Một cộng một đương nhiên là hai." Nhưng việc tự hỏi tại sao một điều gì đó lại đúng sẽ dẫn dắt chúng ta xây dựng những nền móng vững chắc cho toán học, để chúng ta có thể đưa ra những lập luận rõ ràng và chặt chẽ. Một số người thấy sự rõ ràng và đáng tin cậy này thật thư thái và giải phóng tâm trí, trong khi những người khác lại thấy nó gò bó và độc đoán. Nhưng một câu hỏi như "Tại sao 1 + 1 = 2?" cho phép chúng ta khám phá ý tưởng rằng toán học không phải lúc nào cũng có những câu trả lời đúng tuyệt đối, bất biến, mà đúng hơn là có những bối cảnh khác nhau, nơi những điều khác nhau có thể đúng. Điều này sẽ dẫn dắt chúng ta khám phá xem con số bắt nguồn từ đâu ngay từ đầu, làm thế nào chúng ta đi đến các ý niệm về số học, và làm thế nào sau đó chúng ta có thể sử dụng những ý niệm đó trong các bối cảnh toán học khác, chẳng hạn như khi suy nghĩ về hình học. Điều này chạm đến nhiều chủ đề quan trọng trong cách toán học phát triển: bắt đầu từ việc tạo lập các mối liên hệ giữa các sự vật, coi trọng sự trừu tượng hóa, và rồi từng bước một mở rộng tiến trình tư duy của chúng ta để bao quát nhiều hơn thế giới xung quanh.
P||So rather than think about why one plus one is two, let’s go a little further and question whether it’s even true all the time.||Vì vậy, thay vì chỉ nghĩ về lý do tại sao một cộng một bằng hai, chúng ta hãy tiến xa hơn một chút và chất vấn xem liệu điều đó có thực sự luôn luôn đúng trong mọi hoàn cảnh hay không.
H2||PUSHING AGAINST BOUNDARIES||THÁCH THỨC NHỮNG GIỚI HẠN
P||Children seem to be natural seekers of counter-examples. A counter-example is an example showing that something isn’t true. Declaring that something is always true is like putting a boundary around something, and seeking examples that contradict that is like pushing against those imposed boundaries. It’s an important mathematical urge.||Trẻ em dường như là những người bẩm sinh luôn tìm kiếm các phản ví dụ. Phản ví dụ là một ví dụ chỉ ra rằng một điều gì đó không đúng. Tuyên bố rằng một điều gì đó luôn luôn đúng cũng giống như việc đặt ra một ranh giới xung quanh một điều gì đó, và việc tìm kiếm những ví dụ mâu thuẫn với điều đó cũng giống như việc thúc đẩy, thách thức những ranh giới áp đặt ấy. Đó là một thôi thúc toán học quan trọng.
P||You can try prodding a child on one plus one by saying something like this: 'If I give you one cupcake and another cupcake, how many cupcakes will you have?' But they might gleefully declare 'None, because I’ve eaten them!' or indeed 'None, because I don’t like cupcakes.' I am always delighted when I see parents posting pictures of their children’s defiant answers online. One all-time favourite of mine was in answer to the question 'Joe has seven apples and uses five of them to make an apple pie. How many apples does he have left?' to which my friend’s child wrote 'HAS HE EATEN THE PIE YET?' I enjoy answers that are arguably correct while definitely not being the answer that is supposed to count as correct. This shows an important aspect of mathematics, and the children’s thought processes are showing an important but underappreciated aspect of mathematical instinct, the instinct to push against unjustified authority.||Bạn có thể thử thử thách một đứa trẻ về phép tính một cộng một bằng cách nói điều gì đó như thế này: "Nếu mẹ cho con một chiếc bánh cupcake và thêm một chiếc bánh cupcake nữa, con sẽ có bao nhiêu chiếc bánh?" Nhưng chúng có thể hớn hở tuyên bố: "Chẳng có cái nào cả, vì con ăn hết rồi!" hoặc thậm chí: "Không có cái nào, vì con đâu có thích bánh cupcake." Tôi luôn cảm thấy thích thú khi nhìn thấy các bậc cha mẹ đăng tải lên mạng những bức ảnh chụp câu trả lời đầy thách thức của con mình. Một trong những câu trả lời ưa thích nhất mọi thời đại của tôi là đáp án cho câu hỏi: "Joe có bảy quả táo và dùng năm quả để làm một chiếc bánh táo. Cậu ấy còn lại bao nhiêu quả táo?", và đứa con của bạn tôi đã viết: "CẬU ẤY ĐÃ ĂN CÁI BÁNH ĐÓ CHƯA?" Tôi thích những câu trả lời có lý lẽ đúng đắn mà rõ ràng lại không phải là câu trả lời được mặc định là "đúng". Điều này thể hiện một khía cạnh quan trọng của toán học, và quá trình suy nghĩ của những đứa trẻ đang bộc lộ một khía cạnh quan trọng nhưng chưa được đánh giá đúng mực của bản năng toán học: bản năng chống lại quyền uy vô lý.
P||Children may be trying to prod at authority because they’re exploring the boundaries of situations, or because they’re trying to find a sense of self in a world that gives them very little control over anything at all. I remember being a child very clearly, and how frustrating it was that I had to do what adults told me all the time. If I could sense that an adult was asking me a leading question it was rather fun to veer off in a different direction, like by saying I didn’t like cupcakes.||Trẻ em có thể cố gắng thăm dò thẩm quyền bởi vì chúng đang khám phá các giới hạn của những tình huống, hoặc bởi vì chúng đang cố gắng tìm kiếm cảm giác về bản thân trong một thế giới vốn trao cho chúng rất ít quyền kiểm soát đối với mọi thứ. Tôi nhớ thời thơ ấu của mình rất rõ, và cảm giác bực bội biết bao khi lúc nào cũng phải làm theo những gì người lớn bảo. Nếu tôi có thể cảm nhận được người lớn đang hỏi mình một câu hỏi mớm cung, thì thật là thú vị khi bẻ lái sang một hướng hoàn toàn khác, chẳng hạn như nói rằng tôi không thích bánh cupcake.
P||That is, in a way, a cheeky and disruptive urge, but I also think it’s a mathematical urge. Yes, perhaps mathematics is cheeky and disruptive, but another way of putting it is that mathematics is seeking the boundaries of things, just like children are. We want to be clear about the limits to when things are true, so that we can be sure when we’re in a 'safe' area, but also explore outside that area if we’re feeling daring or curious. It’s like a toddler running off into the distance to see at what point an adult will come chasing after them. Thinking about situations in which one plus one is not two is an example of that.||Theo một cách nào đó, đó là một thôi thúc tinh nghịch và mang tính phá cách, nhưng tôi cũng nghĩ đó là một thôi thúc mang tính toán học. Đúng vậy, có lẽ toán học vừa tinh nghịch vừa có tính phá cách, nhưng diễn đạt theo một cách khác thì toán học đang tìm kiếm những ranh giới của vạn vật, y như những đứa trẻ vậy. Chúng ta muốn biết rõ các giới hạn khi nào thì mọi thứ đúng, để có thể chắc chắn khi nào mình đang ở trong một khu vực "an toàn", nhưng cũng để khám phá bên ngoài khu vực đó nếu chúng ta cảm thấy táo bạo hoặc tò mò. Nó giống như một đứa trẻ mới biết đi chạy vụt ra xa để xem đến điểm nào thì người lớn sẽ chạy đuổi theo giữ lại. Suy nghĩ về những tình huống mà một cộng một không bằng hai là một ví dụ cho điều đó.
P||If I say 'I’m not not tired', that means I’m tired, and some children find it very funny to say 'I’m not not not not not not not not not not not tired!' and dissolve into hysterics because they know nobody has been able to keep track of how many times they said 'not'. The point here is that one 'not' plus one 'not' is the same as zero 'nots'. This reminds me of some terrible exam question I once had to mark that involved a long and tedious calculation with many moments for potentially getting a negative sign wrong. It was particularly painful to mark because if students made two such errors, or indeed if they made four, then the answer would turn out right. But in maths the answer doesn’t really count as right unless the process is right (a point I’ll come back to in the next chapter) and so I had to look rather hard to see if the process was wrong even though the answer was 'right'.||Nếu tôi nói "Tôi không phải là không mệt", điều đó có nghĩa là tôi mệt, và một số đứa trẻ cảm thấy rất buồn cười khi nói "Tôi không không không không không không không không không không không mệt!" rồi phá lên cười nắc nẻ vì biết rằng chẳng ai có thể theo dõi nổi chúng đã nói từ "không" bao nhiêu lần. Điểm mấu chốt ở đây là: một chữ "không" cộng với một chữ "không" thì cũng giống như không có chữ "không" nào cả. Điều này làm tôi nhớ đến một câu hỏi thi khủng khiếp mà tôi từng phải chấm, liên quan đến một phép tính dài dòng và tẻ nhạt với vô số thời điểm dễ dẫn đến việc làm sai dấu âm. Việc chấm bài đó đặc biệt đau đớn vì nếu sinh viên phạm hai lỗi sai như vậy, hoặc thực tế là nếu họ phạm bốn lỗi, thì đáp án cuối cùng vẫn ra đúng. Nhưng trong toán học, đáp án không thực sự được coi là đúng trừ khi quá trình giải là đúng (một điểm mà tôi sẽ quay lại trong chương tiếp theo), và vì vậy tôi đã phải căng mắt tìm xem liệu quá trình giải có sai hay không, mặc dù đáp án thì "đúng".
P||Another situation in which one plus one is zero is when everything is already zero, like the world of sweets I lived in when I was little: I was allergic to artificial food colouring, and all sweets had artificial food colouring in those days, so no matter how many sweets I had I effectively had zero.||Một tình huống khác mà một cộng một bằng không là khi mọi thứ vốn dĩ đã bằng không, giống như thế giới bánh kẹo mà tôi sống khi còn nhỏ: tôi bị dị ứng với phẩm màu thực phẩm nhân tạo, và tất cả bánh kẹo thời đó đều có phẩm màu nhân tạo, vì vậy bất kể tôi có bao nhiêu chiếc kẹo đi chăng nữa, về mặt thực tế tôi vẫn có con số không.
P||Sometimes one plus one can equal more than two because of rounding errors. If we’re only working with whole numbers then 1.4 counts as 1 (to the nearest whole number). But then if you do that twice you’ll get 2.8, which counts as 3 (to the nearest whole number). So in the rounded world it will look like one plus one is three. A related but slightly different situation is if you have enough cash on you to buy one cup of coffee, and your friend has enough to buy one, then between you, you still might have enough to buy three, because even if you have one and a half or even 1.9 times the money needed for a cup of coffee, that still only gets you one cup of coffee.||Đôi khi một cộng một có thể bằng nhiều hơn hai do sai số làm tròn. Nếu chúng ta chỉ làm việc với các số nguyên thì 1,4 được tính là 1 (làm tròn đến số nguyên gần nhất). Nhưng nếu bạn lặp lại điều đó hai lần, bạn sẽ có 2,8, con số được tính là 3 (làm tròn đến số nguyên gần nhất). Vì vậy, trong thế giới làm tròn, nó sẽ trông giống như một cộng một bằng ba. Một tình huống tương tự nhưng hơi khác một chút là nếu bạn có đủ tiền mặt để mua một tách cà phê, và bạn của bạn có đủ tiền để mua một tách, thì khi gộp lại, hai bạn vẫn có thể đủ tiền để mua ba tách, bởi vì ngay cả khi bạn có gấp rưỡi hoặc thậm chí gấp 1,9 lần số tiền cần thiết cho một tách cà phê, số tiền đó vẫn chỉ mua được cho bạn đúng một tách cà phê mà thôi.
P||Sometimes one plus one can equal more than one because of reproduction: say perhaps you put one rabbit and another rabbit together, then you might well end up with rather a lot of rabbits. Or sometimes it’s because the things you’re adding together are more complicated: if one pair of tennis players gets together with another pair of tennis players for an afternoon of tennis, there ends up being more than two pairs of tennis players because they could play each other in all sorts of different combinations. If the first pair are called A and B, and the second pair are called C and D, then we have the following pairs in total: AB, AC, AD, BC, BD, CD. So one pair of tennis players plus another pair makes six.||Đôi khi một cộng một có thể bằng nhiều hơn một (hoặc hai) do sự sinh sản: giả sử bạn ghép một con thỏ với một con thỏ khác lại với nhau, bạn rất có thể sẽ kết thúc với khá nhiều thỏ. Hoặc đôi khi đó là vì những thứ bạn đang cộng lại với nhau phức tạp hơn: nếu một cặp vận động viên quần vợt gặp một cặp vận động viên quần vợt khác trong một buổi chiều chơi bóng, kết quả sẽ có nhiều hơn hai cặp vận động viên quần vợt vì họ có thể đấu với nhau theo đủ loại tổ hợp khác nhau. Nếu cặp thứ nhất tên là A và B, và cặp thứ hai tên là C và D, thì tổng cộng chúng ta có các cặp sau: AB, AC, AD, BC, BD, CD. Vậy là một cặp vận động viên quần vợt cộng với một cặp khác lại tạo thành sáu cặp.
P||Sometimes one plus one is just one: if you put a pile of sand on top of another pile of sand, then you just get one pile of sand. Or, as an art student of mine pointed out, if you mix one colour with one colour you get one colour. Or, as I saw in an amusing meme, if you put a lasagne on top of another lasagne it’s still just one lasagne (a taller one).||Đôi khi một cộng một chỉ bằng một: nếu bạn đặt một đống cát lên trên một đống cát khác, bạn chỉ nhận được một đống cát. Hoặc, như một sinh viên mỹ thuật của tôi từng chỉ ra, nếu bạn trộn một màu với một màu, bạn sẽ nhận được một màu. Hoặc, như tôi đã thấy trong một bức ảnh chế hài hước, nếu bạn đặt một chiếc bánh lasagne lên trên một chiếc bánh lasagne khác, nó vẫn chỉ là một chiếc bánh lasagne (một chiếc cao hơn).
P||A slightly different scenario in which one plus one is one is if you have a voucher for, say, a doughnut with your coffee, but there’s a maximum of one per person, so that even if you have another one it’s just like you only have one (unless there’s someone you can give it to). Or if you’re pressing the 'open doors' button on a train, pressing it more than once is just the same as pressing it once. At least, it’s the same in terms of the effect it has on the doors, but perhaps not in terms of the amount of your frustration you get to express; perhaps that’s why people so often seem to stand there hitting it repeatedly.||Một kịch bản hơi khác một chút trong đó một cộng một bằng một là nếu bạn có một phiếu giảm giá, chẳng hạn như cho một chiếc bánh doughnut đi kèm với cà phê, nhưng quy định chỉ tối đa một phiếu cho mỗi người, do đó ngay cả khi bạn có thêm một phiếu nữa thì cũng giống như bạn chỉ có một phiếu mà thôi (trừ khi có ai đó để bạn tặng lại). Hoặc nếu bạn nhấn nút "mở cửa" trên tàu hỏa, việc nhấn nút đó nhiều lần cũng chẳng khác gì việc nhấn một lần. Ít nhất, nó giống nhau về mặt tác động lên cánh cửa, nhưng có lẽ không giống nhau về mức độ giải tỏa nỗi bực bội mà bạn muốn thể hiện; có lẽ đó là lý do tại sao mọi người thường hay đứng đó và bấm lia lịa vào nó.
P||Now, you might think that the situations above aren’t really situations in which one plus one equals something else, because they aren’t really addition, or those aren’t really numbers, or some other reason that they don’t count. You’re welcome to think that, but that’s not what maths does.||Bây giờ, bạn có thể nghĩ rằng những tình huống trên không thực sự là những tình huống mà một cộng một bằng một kết quả khác, bởi vì chúng không thực sự là phép cộng, hoặc đó không thực sự là những con số, hoặc một lý do nào đó khác khiến chúng không được tính. Bạn hoàn toàn có quyền nghĩ như vậy, nhưng đó không phải là cách toán học tiếp cận.
P||Maths instead says: let’s work out what those contexts are and what they mean. Let’s work out what the consequences are of things being like that, and see what other contexts we can find in which things work in similar ways. Let’s be more clear about the context in which one plus one really does equal two, and contexts in which it doesn’t, and in doing so we’ll understand something about the world more deeply than we did before.||Thay vào đó, toán học nói rằng: chúng ta hãy tìm hiểu xem những bối cảnh đó là gì và chúng có ý nghĩa như thế nào. Hãy tìm hiểu xem hậu quả của việc mọi thứ diễn ra như vậy là gì, và xem chúng ta có thể tìm thấy những bối cảnh nào khác mà ở đó mọi thứ cũng hoạt động theo những cách tương tự. Chúng ta hãy làm rõ hơn về bối cảnh mà ở đó một cộng một thực sự bằng hai, và những bối cảnh mà nó không bằng hai, và khi làm như vậy, chúng ta sẽ hiểu một điều gì đó về thế giới một cách sâu sắc hơn trước đây.
P||This is where maths comes from. And in order to explore contexts in which one plus one does and doesn’t equal two, I want to do more than just dig into where that equation comes from. I want to dig all the way into where any maths comes from at all.||Đây chính là nơi toán học bắt nguồn. Và để khám phá các bối cảnh mà trong đó một cộng một bằng và không bằng hai, tôi muốn làm nhiều hơn là chỉ đào sâu vào việc phương trình đó bắt nguồn từ đâu. Tôi muốn đào sâu đến tận cùng cội rễ xem bất kỳ nhánh toán học bắt nguồn từ đâu.
H2||THE ORIGINS OF MATHS||NGUỒN GỐC CỦA TOÁN HỌC
P||Maths comes from wanting to understand things better. And in order to understand things better we find a way to think about them that makes them easier. One way to make things easier is just to ignore the hard parts, but a better way is to come up with a point of view that enables us to focus on the part that is relevant to us right now, while not completely forgetting that the other parts exist.||Toán học bắt nguồn từ mong muốn hiểu mọi thứ rõ hơn. Và để hiểu mọi thứ rõ hơn, chúng ta tìm ra một cách tư duy về chúng giúp chúng trở nên dễ dàng hơn. Một cách để làm cho mọi thứ dễ dàng hơn là chỉ việc phớt lờ những phần khó khăn, nhưng một cách tốt hơn là đưa ra một góc nhìn cho phép chúng ta tập trung vào phần có liên quan đến mình ngay lúc này, trong khi không hoàn toàn quên mất rằng các phần khác vẫn đang tồn tại.
P||It’s a bit like having a filter over a camera lens that temporarily enables us to focus on particular colours, before switching it for another filter to look at other colours. Or like that stage of making a stew where you strain the liquid out in order to reduce and thicken it – you don’t throw away the stuff that you’ve strained out, you put it back in again afterwards.||Nó hơi giống như việc lắp một thấu kính lọc lên ống kính máy ảnh, tạm thời cho phép chúng ta tập trung vào các màu sắc cụ thể, trước khi đổi nó lấy một bộ lọc khác để quan sát các màu sắc khác. Hoặc giống như công đoạn nấu món hầm, nơi bạn chắt phần nước dùng ra để đun cạn và làm cho nó sánh lại – bạn không vứt bỏ những thứ cái mà mình đã lọc ra, bạn chỉ cho chúng trở lại vào nồi sau đó.
P||The most well-known basic starting point for maths is numbers. This is most children’s first introduction to maths and their first impression of what maths is, and it remains many people’s lasting impression of what maths is. But maths is about so much more than numbers. And even when maths appears to be about numbers, it’s often not actually about numbers, but rather, about the process of how we get from our world to the world of numbers at all, and what insights we gain by doing so.||Điểm khởi đầu cơ bản và quen thuộc nhất của toán học là các con số. Đây là phần mở đầu đầu tiên về toán học của hầu hết trẻ em và là ấn tượng đầu tiên của chúng về toán học là gì, và nó vẫn là ấn tượng lâu bền của rất nhiều người về bản chất của toán học. Nhưng toán học bao trùm nhiều thứ hơn là chỉ các con số. Và ngay cả khi toán học dường như chỉ xoay quanh các con số, thì trên thực tế nó thường không nói về các con số, mà đúng hơn là về quá trình làm thế nào chúng ta đi từ thế giới thực của mình đến thế giới của các con số ngay từ đầu, và chúng ta thu được những hiểu biết sâu sắc nào bằng cách làm như vậy.
P||The thing about the strong association of maths with numbers is that numbers can seem boring to anyone who likes ambiguity, creativity, wild exploration, imagination. I’m not going to try and claim that numbers are interesting, but the opposite: that they are indeed boring, and that that’s the entire point of them.||Vấn đề của sự liên tưởng mạnh mẽ giữa toán học với các con số là những con số có vẻ buồn tẻ đối với bất kỳ ai yêu thích sự mơ hồ, tính sáng tạo, sự khám phá phóng khoáng và trí tưởng tượng. Tôi sẽ không cố gắng khẳng định rằng các con số là thú vị, mà ngược lại: chúng thực sự buồn tẻ, và đó chính là toàn bộ mục đích tồn tại của chúng.
P||The point is to encapsulate one aspect of the world around us so that we can be done with that part as fast as possible, leaving the more interesting part of our brain to deal with the more exciting parts of the world. It’s like getting a computer to run all the least interesting parts of life (which for me is paying bills, ordering groceries, scaling recipes) so that I can save my brain for the more interesting parts: interacting with people, playing music, cooking delicious food.||Mục đích ở đây là gói gọn một khía cạnh của thế giới xung quanh chúng ta để chúng ta có thể xử lý phần đó càng nhanh càng tốt, giải phóng phần thú vị hơn của bộ não để giải quyết những phần lý thú hơn của thế giới. Nó giống như việc giao cho máy tính xử lý tất cả những phần kém thú vị nhất của cuộc sống (đối với tôi là thanh toán hóa đơn, đặt mua đồ tạp hóa, cân đối định lượng công thức nấu ăn) để tôi có thể dành bộ não của mình cho những phần thú vị hơn: tương tác với mọi người, chơi nhạc, nấu những món ăn ngon.
P||Numbers come from wanting to simplify the world around us. No wonder the result is simple, and thus, potentially boring. But how we invent numbers in the first place is rather profound. Numbers come from us making an analogy between different situations, and choosing which part of those situations to ignore temporarily. We might look at two apples and two bananas and see some similarity between them, which we then encapsulate in our brains as the concept of 'two'. But in order to do that we have to ignore the applehood of the apples and the bananahood of the bananas, and see those things as just objects, abstractly, without those particular properties.||Các con số bắt nguồn từ mong muốn đơn giản hóa thế giới xung quanh chúng ta. Chẳng trách kết quả lại đơn giản, và do đó, tiềm ẩn sự tẻ nhạt. Nhưng cách chúng ta phát minh ra các con số ngay từ ban đầu lại khá sâu sắc. Con số xuất phát từ việc chúng ta tạo ra sự tương đồng giữa các tình huống khác nhau, và chọn tạm thời phớt lờ phần nào của những tình huống đó. Chúng ta có thể nhìn vào hai quả táo và hai quả chuối rồi nhận thấy điểm tương đồng nào đó giữa chúng, điều mà sau đó chúng đúc kết trong não bộ của mình thành khái niệm "hai". Nhưng để làm được điều đó, chúng ta phải phớt lờ "tính-táo" của những quả táo và "tính-chuối" của những quả chuối, và nhìn nhận những thứ đó chỉ đơn thuần là các vật thể, một cách trừu tượng, mà không mang những thuộc tính cụ thể đó.
P||This is a leap of abstraction. It’s a difficult leap to make, and no wonder it takes children a while to make that leap. We can encourage them to do it, by repeatedly counting things right in front of them, but in the end they have to make that leap for themselves, and we can’t do it for them.||Đây là một bước nhảy trừu tượng hóa. Đó là một bước nhảy khó khăn, và chẳng trách trẻ em phải mất một thời gian mới thực hiện được bước nhảy đó. Chúng ta có thể khuyến khích chúng làm điều đó bằng cách liên tục đếm các đồ vật ngay trước mặt chúng, nhưng cuối cùng chúng phải tự mình thực hiện bước nhảy đó, và chúng ta không thể làm thay chúng được.
P||The trouble is that it can seem reductive to forget those crucial features of the objects in question, and if we only focus on the part where we 'made things more boring' then we make everything sound boring, instead of focusing on what the point of it was, which was to open up amazing new channels of understanding.||Rắc rối là ở chỗ việc quên đi những đặc điểm cốt yếu đó của các đối tượng đang xét có vẻ mang tính giản lược, và nếu chúng ta chỉ tập trung vào phần mà chúng ta "đã làm cho mọi thứ trở nên buồn tẻ hơn" thì chúng ta sẽ khiến mọi thứ nghe có vẻ tẻ nhạt, thay vì tập trung vào mục đích thực sự của nó: mở ra những kênh hiểu biết mới mẻ và kỳ diệu.
H2||THE POINT OF ABSTRACTION||MỤC ĐÍCH CỦA SỰ TRỪU TƯỢNG HÓA
P||By inventing numbers we’ve done something quite profound: we’ve made an abstraction. Abstraction is when we forget some details about a situation in order to consider an 'idealised' version, which is not the same as the concrete (real-world) version but captures the features we want to think about right now. It takes us further away from the real-world situation, but with an aim: the aim is to find similarities between different situations so that we can understand more situations at once without having to do so much work. In a way, we’re simplifying our building blocks in order to be able to build more creatively. It’s like the difference between a jigsaw puzzle that has to fit together in a certain way to make a given picture (and the pieces will only fit together one way) and a jigsaw puzzle with pieces that are more general, that fit together in many different ways, where the aim is not to see if you can build one particular picture, but to see all the different structures you can build. I always enjoyed the tangram puzzle for this reason, the pieces just being generic geometric shapes: a square, some triangles in different sizes, and a parallelogram. It is thought to date back to eighteenth-century China, although similar constructions date back to much earlier Chinese mathematicians. The shapes can fit together into a square as shown below, but can also be used to make an endless range of other shapes, depicting people, animals or whatever you can imagine, albeit in a somewhat stylised way. Here’s a rabbit:||Bằng cách phát minh ra các con số, chúng ta đã làm được một điều khá sâu sắc: chúng ta đã thực hiện một sự trừu tượng hóa. Trừu tượng hóa là khi chúng ta bỏ qua một số chi tiết về một tình huống để xem xét một phiên bản "lý tưởng hóa", phiên bản này không giống hệt phiên bản cụ thể (trong thế giới thực) nhưng nắm bắt được những đặc điểm mà chúng ta muốn suy nghĩ tới ngay lúc này. Nó đưa chúng ta rời xa hơn khỏi tình huống thực tế, nhưng nhằm một mục đích: mục đích là tìm ra những điểm tương đồng giữa các tình huống khác nhau để chúng ta có thể hiểu nhiều tình huống cùng một lúc mà không cần phải tốn quá nhiều công sức. Theo một cách nào đó, chúng ta đang đơn giản hóa các khối xây dựng của mình để có thể xây dựng một cách sáng tạo hơn. Nó giống như sự khác biệt giữa một bức tranh ghép hình (puzzle) phải khớp với nhau theo một cách nhất định để tạo thành một bức tranh cho trước (và các mảnh ghép chỉ khớp với nhau theo đúng một cách duy nhất) với một bộ ghép hình có các mảnh mang tính tổng quát hơn, có thể ghép lại với nhau theo nhiều cách khác nhau, nơi mục đích không phải là xem liệu bạn có thể ghép thành một bức tranh cụ thể hay không, mà là để khám phá tất cả các cấu trúc khác nhau mà bạn có thể tạo dựng nên. Tôi luôn thích trò chơi ghép hình tangram vì lý do này, các mảnh ghép chỉ là những hình học thông thường: một hình vuông, vài hình tam giác với các kích cỡ khác nhau, và một hình bình hành. Trò chơi này được cho là có từ thế kỷ thứ mười tám ở Trung Quốc, mặc dù các cấu trúc tương tự đã xuất hiện từ thời các nhà toán học Trung Quốc sớm hơn rất nhiều. Các mảnh ghép có thể ghép lại thành một hình vuông như hình dưới đây, nhưng cũng có thể được sử dụng để tạo ra vô số hình dạng khác, mô tả con người, động vật hoặc bất cứ thứ gì bạn có thể tưởng tượng, dẫu cho theo một phong cách có phần cách điệu. Đây là một con thỏ:
